name: Build dependencies

on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * *"

jobs:
  build_container:
    name: ${{ matrix.compiler }} · ${{ matrix.os }}

    permissions:
      contents: write
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ghcr.io/acts-project/ubuntu2404:82
            compiler: gcc@13.3.0
            os: ubuntu-24.04
            default: true

          - image: ghcr.io/acts-project/ubuntu2404:82
            compiler: gcc@13.3.0
            os: ubuntu-24.04-arm
            default: false

    uses: ./.github/workflows/build_one.yml
    with:
      os: ${{ matrix.os }}
      image: ${{ matrix.image }}
      compiler: ${{ matrix.compiler }}
      compiler_path: ${{ matrix.compiler_path || '' }}
      cxxstd: ${{ matrix.cxxstd || '20' }}
      default: ${{ matrix.default }}

    secrets: inherit

  merge_container:
    name: Merge and push container manifests
    runs-on: ubuntu-latest
    needs: [build_container]
    if: startsWith(github.ref, 'refs/tags/')

    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build merged manifest and push to registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run merge_images.py \
            ${{ github.ref_name }} \
            ".*ubuntu24.04.*gcc.*" \
            --push \
            --registry ghcr.io/opendatadetector/sw \
            --summary release_summary.md

      - name: Add lock files and Dockerfiles to release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          body_path: release_summary.md
          append_body: true
