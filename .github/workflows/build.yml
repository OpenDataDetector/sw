name: Build dependencies

on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "5 4 * * *"

jobs:
  build_container:

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:

        include:
          - os: ubuntu-24.04
          - os: ubuntu-24.04-arm

    uses: ./.github/workflows/build_one.yml
    with:
      os: ${{ matrix.os }}

    secrets: inherit

  merge_container:
    runs-on: ubuntu-latest
    needs: [build_container]
    # if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Install the latest version of uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "latest"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build merged manifest and push to regisrty
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run merge_images.py \
            ${{ github.ref_name }} \
            ".*ubuntu24.04.*gcc.*" \
            --push \
            --registry ghcr.io/opendatadetector/sw
