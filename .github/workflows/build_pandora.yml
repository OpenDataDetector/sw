name: Build Pandora reco image

# The ColliderML reco container (Container B): a key4hep-based image that runs the
# calibrated Pandora particle flow (calo_digitization + pandora_reco). It is built
# differently from the spack images in build.yml — a plain `docker build` FROM the
# key4hep no-cvmfs base (that stack ships ROOT *+eve*, which the sw spack image's
# ROOT 6.38 lacks; KalTest -> charged-PF Pandora needs Eve). See docker/pandora/.

on:
  push:
    tags:
      - '*'
    branches:
      - 'main'
  pull_request:
    paths:
      - 'docker/pandora/**'
      - 'ci/smoke_test_pandora.sh'
      - '.github/workflows/build_pandora.yml'
  workflow_dispatch:
  schedule:
    - cron: "20 4 * * *"

jobs:
  build_pandora:
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write

    env:
      # Push to the sw registry, distinguished by a `pandora-` tag prefix.
      IMAGE: ghcr.io/opendatadetector/sw

    steps:
      - uses: actions/checkout@v4

      # The reco image is large (~26 GB incl. the key4hep base). Free runner disk the
      # same way the spack build does, or the build/load runs out of space.
      - name: Remove packages to save disk
        run: |
          df -h
          sudo apt-get update
          ci/uninstall_packages.py || true
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Pandora variant tags (kept namespaced so they don't collide with the spack tags)
          tags: |
            type=raw,value=pandora,enable={{is_default_branch}}
            type=ref,event=branch,prefix=pandora-
            type=ref,event=pr,prefix=pandora-pr-
            type=sha,prefix=pandora-
            type=schedule,pattern=pandora-nightly

      # Build + load locally so the smoke test can run the exact image (single-arch amd64).
      - name: Build (load for testing)
        uses: docker/build-push-action@v6
        with:
          context: docker/pandora
          file: docker/pandora/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Smoke test (ddsim + Pandora -> PFOs, self-contained)
        run: |
          TAG=$(echo "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing $TAG"
          docker run --rm -v "$PWD/ci:/ci:ro" "$TAG" bash /ci/smoke_test_pandora.sh

      # Push only on main / tags (after the smoke test passes).
      - name: Push
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: |
          echo "${{ steps.meta.outputs.tags }}" | while read -r t; do
            [ -n "$t" ] && docker push "$t"
          done
